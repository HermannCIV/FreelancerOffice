name: reporting-mcp tests

on:
  push:
    paths:
      - "reporting-mcp/server/**"
      - ".github/workflows/reporting-mcp-tests.yml"
  pull_request:
    paths:
      - "reporting-mcp/server/**"
      - ".github/workflows/reporting-mcp-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: reporting-mcp/server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: reporting-mcp/server/package-lock.json
      - run: npm ci
      - run: npm test
